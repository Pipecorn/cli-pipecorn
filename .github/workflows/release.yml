name: release

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  tarballs:
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # --no-xz: nothing consumes the .tar.xz assets and xz dominates this step.
      - run: npx oclif pack tarballs --parallel --no-xz --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64
      # oclif stamps a commit sha into each tarball name; the Homebrew formula
      # needs a URL it can build from the version alone.
      - name: Normalise tarball names
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            src="$(find dist -maxdepth 1 -name "*-$target.tar.gz" | head -1)"
            dest="dist/pipecorn-v$version-$target.tar.gz"
            if [ -z "$src" ]; then
              echo "no tarball packed for $target" >&2
              exit 1
            fi
            [ "$src" = "$dest" ] || mv "$src" "$dest"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/pipecorn-v*.tar.gz

  homebrew:
    runs-on: ubuntu-latest
    needs: tarballs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pipecorn-v*-darwin-*.tar.gz' \
            --dir dist
      - name: Render cask
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/render-homebrew-cask.sh "$version" dist > pipecorn.rb
          cat pipecorn.rb
      - name: Push cask to pipecorn/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/pipecorn/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp pipecorn.rb tap/Casks/pipecorn.rb
          # A formula sharing the token would win over the cask, and installing it
          # counts as a source build: Homebrew then demands a current Xcode/CLT for
          # a tarball that needs no compiler.
          rm -f tap/Formula/pipecorn.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "pipecorn $version"
          git push
